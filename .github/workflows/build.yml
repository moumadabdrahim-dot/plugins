name: Build CloudStream Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone CloudStream template
        run: |
          git clone --depth 1 https://github.com/recloudstream/TestPlugins.git cloudstream-template

      - name: Copy AsiaTvPlugin
        run: |
          rm -rf cloudstream-template/AsiaTvPlugin
          cp -r AsiaTvPlugin cloudstream-template/AsiaTvPlugin

      - name: Fix CloudStream build configuration
        working-directory: cloudstream-template
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle.kts")
          text = path.read_text()

          replacements = {
              "com.android.tools.build:gradle:8.7.3":
                  "com.android.tools.build:gradle:8.13.2",

              "com.github.recloudstream:gradle:-SNAPSHOT":
                  "com.github.recloudstream:gradle:81b1d424d2",

              "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0":
                  "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20",

              "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0":
                  "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20",
          }

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  print(f"Updated: {old} -> {new}")
              else:
                  print(f"Not present: {old}")

          path.write_text(text)
          PY

          echo "========================================"
          echo "Final CloudStream build configuration"
          echo "========================================"

          grep -n "com.android.tools.build:gradle" build.gradle.kts || true
          grep -n "com.github.recloudstream:gradle" build.gradle.kts || true
          grep -n "kotlin-gradle-plugin" build.gradle.kts || true

      - name: Make Gradle executable
        working-directory: cloudstream-template
        run: |
          chmod +x gradlew

      - name: Show Gradle projects
        working-directory: cloudstream-template
        run: |
          ./gradlew projects --no-daemon --stacktrace

      - name: Build AsiaTvPlugin
        working-directory: cloudstream-template
        run: |
          ./gradlew :AsiaTvPlugin:make --no-daemon --stacktrace

      - name: Find generated CS3
        run: |
          echo "Searching for generated .cs3 files..."

          find cloudstream-template \
            -type f \
            -name "*.cs3" \
            -print

      - name: Copy CS3 to builds
        run: |
          mkdir -p builds

          CS3_FILE=$(find cloudstream-template \
            -type f \
            -name "*.cs3" \
            | head -n 1)

          if [ -z "$CS3_FILE" ]; then
            echo "ERROR: No .cs3 file was generated."
            exit 1
          fi

          echo "========================================"
          echo "Generated plugin:"
          echo "$CS3_FILE"
          echo "========================================"

          cp "$CS3_FILE" builds/

          echo "Contents of builds:"
          ls -lah builds/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add builds/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build AsiaTvPlugin"
          git push
