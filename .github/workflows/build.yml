name: Build CloudStream Plugin
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone template
        run: git clone https://github.com/recloudstream/TestPlugins.git template
      - name: Copy plugin
        run: |
          rm -rf template/AsiaTvPlugin
          cp -r AsiaTvPlugin template/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build
        working-directory: template
        run: |
          chmod +x gradlew
          ./gradlew :AsiaTvPlugin:make --stacktrace
      - name: Push builds
        run: |
          mkdir -p builds
          find template -name "*.cs3" -exec cp {} builds/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/
          git diff --cached --quiet || git commit -m "Build AsiaTvPlugin"
          git push
