name: Build CloudStream Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone CloudStream template
        run: |
          git clone --depth 1 https://github.com/recloudstream/TestPlugins.git cloudstream-template

      - name: Copy AsiaTvPlugin
        run: |
          rm -rf cloudstream-template/AsiaTvPlugin
          cp -r AsiaTvPlugin cloudstream-template/AsiaTvPlugin

      - name: Align CloudStream build tools
        working-directory: cloudstream-template
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle.kts")
          text = path.read_text()

          replacements = {
              'classpath("com.android.tools.build:gradle:8.6.1")':
                  'classpath("com.android.tools.build:gradle:8.13.2")',

              'classpath("com.github.recloudstream:gradle:-SNAPSHOT")':
                  'classpath("com.github.recloudstream:gradle:81b1d424d2")',

              'classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0")':
                  'classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20")',
          }

          for old, new in replacements.items():
              if old not in text:
                  print(f"WARNING: not found: {old}")
              else:
                  text = text.replace(old, new, 1)
                  print(f"Updated: {old} -> {new}")

          path.write_text(text)
          PY

          echo "===== CloudStream Gradle Plugin ====="
          grep -n "com.github.recloudstream:gradle" build.gradle.kts || true

          echo "===== Android Gradle Plugin ====="
          grep -n "com.android.tools.build:gradle" build.gradle.kts || true

          echo "===== Kotlin Gradle Plugin ====="
          grep -n "kotlin-gradle-plugin" build.gradle.kts || true

      - name: Make Gradle executable
        working-directory: cloudstream-template
        run: |
          chmod +x gradlew

      - name: Show Gradle projects
        working-directory: cloudstream-template
        run: |
          ./gradlew projects --no-daemon --stacktrace

      - name: Build AsiaTvPlugin
        working-directory: cloudstream-template
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./gradlew :AsiaTvPlugin:make --no-daemon --stacktrace

      - name: Find generated CS3
        run: |
          echo "Searching for generated .cs3 files..."

          find cloudstream-template -type f -name "*.cs3" -print

      - name: Copy CS3 to builds
        run: |
          mkdir -p builds

          CS3_FILE=$(find cloudstream-template -type f -name "*.cs3" | head -n 1)

          if [ -z "$CS3_FILE" ]; then
            echo "ERROR: No .cs3 file was generated."
            exit 1
          fi

          echo "Generated plugin:"
          echo "$CS3_FILE"

          cp "$CS3_FILE" builds/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add builds/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build AsiaTvPlugin"
          git push
