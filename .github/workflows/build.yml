name: Build CloudStream Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone CloudStream TestPlugins
        run: |
          git clone --depth 1 https://github.com/recloudstream/TestPlugins.git cloudstream-template

      - name: Copy AsiaTvPlugin into template
        run: |
          rm -rf cloudstream-template/AsiaTvPlugin
          cp -r AsiaTvPlugin cloudstream-template/AsiaTvPlugin

      - name: Prepare Gradle
        working-directory: cloudstream-template
        run: |
          chmod +x gradlew

      - name: Show Gradle version
        working-directory: cloudstream-template
        run: |
          ./gradlew --version

      - name: Verify AsiaTvPlugin project
        working-directory: cloudstream-template
        run: |
          ./gradlew :AsiaTvPlugin:tasks --no-daemon --stacktrace

      - name: Build AsiaTvPlugin
        working-directory: cloudstream-template
        run: |
          ./gradlew :AsiaTvPlugin:make --no-daemon --stacktrace

      - name: Find generated CS3
        run: |
          echo "Searching for AsiaTvPlugin .cs3..."

          find cloudstream-template/AsiaTvPlugin \
            -type f \
            -name "*.cs3" \
            -print

          CS3_FILE=$(find cloudstream-template/AsiaTvPlugin \
            -type f \
            -name "*.cs3" \
            | head -n 1)

          if [ -z "$CS3_FILE" ]; then
            echo "ERROR: AsiaTvPlugin .cs3 was not generated."
            exit 1
          fi

          echo "Generated file:"
          echo "$CS3_FILE"

      - name: Copy plugin to builds
        run: |
          mkdir -p builds

          CS3_FILE=$(find cloudstream-template/AsiaTvPlugin \
            -type f \
            -name "*.cs3" \
            | head -n 1)

          if [ -z "$CS3_FILE" ]; then
            echo "ERROR: No .cs3 file found."
            exit 1
          fi

          cp "$CS3_FILE" builds/AsiaTv.cs3

          echo "========================================"
          echo "Final plugin file:"
          echo "========================================"

          ls -lh builds/AsiaTv.cs3

      - name: Verify plugin file
        run: |
          test -f builds/AsiaTv.cs3

          FILE_SIZE=$(stat -c%s builds/AsiaTv.cs3)

          echo "AsiaTv.cs3 size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -le 0 ]; then
            echo "ERROR: AsiaTv.cs3 is empty."
            exit 1
          fi

      - name: Commit and push generated plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add builds/AsiaTv.cs3

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build AsiaTvPlugin"
          git push
