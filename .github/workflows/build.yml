name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Clone CloudStream TestPlugins
        run: |
          git clone --depth 1 https://github.com/recloudstream/TestPlugins.git template

      - name: Copy plugin modules
        run: |
          for plugin in AsiaTvPlugin OscarTVPlugin DramaSlayerPlugin; do
            rm -rf "template/$plugin"
            cp -r "src/$plugin" "template/$plugin"
          done

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Update Kotlin version
        working-directory: template
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle.kts")
          text = path.read_text()

          old = 'classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0")'
          new = 'classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0")'

          if old not in text:
              raise SystemExit("Expected Kotlin 2.1.0 line was not found")

          text = text.replace(old, new)
          text = text.replace("JVM_1_8", "JVM_11")
          text = text.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_11")
          path.write_text(text)
          PY

      - name: Build plugins
        working-directory: template
        run: |
          chmod +x gradlew
          for attempt in 1 2 3 4 5 6; do
            if ./gradlew :AsiaTvPlugin:make :OscarTVPlugin:make :DramaSlayerPlugin:make \
              --no-daemon \
              --stacktrace; then
              exit 0
            fi

            if [ "$attempt" -lt 6 ]; then
              echo "Gradle build attempt $attempt failed; retrying in 30 seconds"
              sleep 30
            fi
          done
          exit 1

      - name: Find generated plugin
        run: |
          echo "Generated .cs3 files:"
          find template -type f -name "*.cs3" -print

      - name: Publish plugin builds
        run: |
          for plugin in AsiaTv OscarTV DramaSlayer; do
            rm -f "$GITHUB_WORKSPACE/builds/$plugin.cs3"

            CS3_FILE="$(find "template/${plugin}Plugin" -type f -name "*.cs3" | head -n 1)"

            if [ -z "$CS3_FILE" ]; then
              echo "ERROR: No .cs3 file was generated for $plugin"
              exit 1
            fi

            cp "$CS3_FILE" "$GITHUB_WORKSPACE/builds/$plugin.cs3"
          done

          echo "Published:"
          ls -lh "$GITHUB_WORKSPACE/builds/AsiaTv.cs3" "$GITHUB_WORKSPACE/builds/OscarTV.cs3" "$GITHUB_WORKSPACE/builds/DramaSlayer.cs3"

      - name: Push builds branch
        working-directory: builds
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          git add AsiaTv.cs3 OscarTV.cs3 DramaSlayer.cs3

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Build plugins from $GITHUB_SHA"
          git push origin builds
